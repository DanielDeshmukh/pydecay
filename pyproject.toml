[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pydecay"
dynamic = ["version"]
description = "Radioactive decay mathematics: analytical decay, Bateman chains with branching, and activity unit conversions"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
# Keep name and email in separate author entries so hatchling emits
# Author: Daniel Deshmukh and Author-email: deshmukhdaniel2005@gmail.com
# (a single { name, email } entry is folded into Author-email: Name <email>).
authors = [
  { name = "Daniel Deshmukh" },
  { email = "deshmukhdaniel2005@gmail.com" },
]
keywords = ["radioactive", "decay", "bateman", "half-life", "activity", "nuclear", "radioactivity"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Physics",
  "Typing :: Typed",
]
dependencies = [
  "numpy>=1.23",
  "scipy>=1.9",
  "pint>=0.20",
]

[project.urls]
Homepage = "https://github.com/DanielDeshmukh/pydecay"
Repository = "https://github.com/DanielDeshmukh/pydecay"
Issues = "https://github.com/DanielDeshmukh/pydecay/issues"

[project.optional-dependencies]
test = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "hypothesis>=6",
  "radioactivedecay>=0.6,<1",
  "tomli>=2.0; python_version < '3.11'",
]
docs = ["mkdocs-material>=9.5"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.4", "mypy>=1.8", "build>=1.0"]

[tool.hatch.version]
path = "src/pydecay/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pydecay"]
exclude = ["**/_fetch_iaea.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["pydecay"]
omit = ["*/data/_fetch_iaea.py"]
branch = false

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D", "RUF"]
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"examples/**" = ["D"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["pydecay"]

[[tool.mypy.overrides]]
module = "pint.*"
ignore_errors = true
